[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowlageMCP"
version = "0.1.0"
description = "Host-canonical knowledge memory service for AI coding agents, with an MCP bridge."
requires-python = ">=3.11"
license = "ISC"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "René Widera", email = "r.widera@hzdr.de" }]
keywords = ["mcp", "knowledge", "sqlite", "agents", "memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: ISC License (ISCL)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.3,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "httpx2>=2.16",
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "reuse[charset-normalizer]>=4.0",
  "build>=1.2",
]

[project.scripts]
knowlageMCP-gateway = "knowlage_mcp.cli:main"
knowlageMCP-gatewayctl = "knowlage_mcp.gatewayctl:main"
knowlageMCP-mcp = "knowlage_mcp.bridge:main"

[project.urls]
Homepage = "https://github.com/psychocoderHPC-bot/knowlageMCP"

[tool.hatch.build.targets.wheel]
packages = ["src/knowlage_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/knowlage_mcp",
  "tests",
  "skills",
  "systemd",
  "LICENSE",
  "LICENSES",
  "REUSE.toml",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "AGENTS.md",
  "config.example.toml",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["knowlage_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "platformdirs", "platformdirs.*", "tomli_w", "tomli_w.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
  "integration: tests that start real transports or processes",
  "security: security-boundary regression tests",
  "quality: labelled retrieval and context quality corpus",
  "slow: tests that take more than a few seconds",
]
addopts = "-ra"

[tool.coverage.run]
source = ["knowlage_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
