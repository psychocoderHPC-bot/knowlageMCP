# SPDX-License-Identifier: ISC

version = 1
SPDX-PackageName = "knowlageMCP"
SPDX-PackageSupplier = "René Widera <r.widera@hzdr.de>"
SPDX-PackageDownloadLocation = "https://github.com/psychocoderHPC-bot/knowlageMCP"

# License texts themselves cannot carry SPDX comment headers.
[[annotations]]
path = ["LICENSE", "LICENSES/ISC.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 René Widera"
SPDX-License-Identifier = "ISC"

# JSON cannot carry SPDX comment headers; this annotation covers only the
# versioned quality corpus, not every JSON file in the repository.
[[annotations]]
path = ["benchmarks/corpus_v1.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 René Widera"
SPDX-License-Identifier = "ISC"

# The machine-readable benchmark baseline is generated JSON and cannot carry
# an SPDX comment header.
[[annotations]]
path = ["benchmarks/baseline_v1.json"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 René Widera"
SPDX-License-Identifier = "ISC"

# JSONL cannot carry SPDX comment headers; this annotation covers only the
# golden version 1 export-format fixture.
[[annotations]]
path = ["tests/fixtures/export_v1.jsonl"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 René Widera"
SPDX-License-Identifier = "ISC"
